name: Source formatting
on: [push, pull_request]
jobs:
  format:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.work/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.work/cache
      PIP_CACHE_DIR: ${{ github.workspace }}/.work/cache/pip
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME" "$PIP_CACHE_DIR"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff==0.16.8
      - run: npm ci --prefix tools/formatting --cache .work/cache/npm-formatting
      - run: python scripts/format_code.py --check
