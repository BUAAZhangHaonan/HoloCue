[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "holocue"
version = "0.1.0"
description = "Task-conditioned holographic cues: agent and simulation starter"
requires-python = ">=3.11"
dependencies = [
 "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
 "httpx>=0.27,<1", "numpy>=1.26,<3", "trimesh>=4.6,<5", "pillow>=10,<13",
 "psutil>=5.9,<8", "langgraph>=1.0,<2", "viser>=1.0,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9"]
[project.scripts]
holocue-api = "holocue.api:main"
holocue-viewer = "holocue.viewer:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires installed LangGraph, Viser or a live model"]
[tool.ruff]
line-length = 110
